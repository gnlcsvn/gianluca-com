    <noscript><p class="post__text">penplotting project that visualizes z-fighting. I learned about z-fighting in my digital media studies. Found the slides, they still teach it. <br><br>Z-fighting basically is when two planes in a 3-dimensional space occupy the same z-coordinates and the renderer has to decide which one is “on top” and then you get this flickering. <br><br>In this example you can see two objects one red one blue that are pretty much at the exact same coordinates in 3d space but one is slightly shifted. <br><br>I first render them in the browser and then have Claude build a lined based counterpart that can be pen plotted.</p></noscript>
