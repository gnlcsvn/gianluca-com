<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" role="img" aria-label="Abstract stack of post cards with a single blue accent line">
  <rect width="1200" height="630" fill="#fbfbfc"/>
  <!-- stacked, receding post cards -->
  <rect x="300" y="120" width="600" height="90" rx="12" fill="#eeeff1"/>
  <rect x="300" y="232" width="600" height="90" rx="12" fill="#e4e5e8"/>
  <rect x="300" y="344" width="600" height="90" rx="12" fill="#eeeff1"/>
  <!-- a single note, lifted, with the blue accent edge -->
  <rect x="276" y="452" width="648" height="100" rx="12" fill="#ffffff" stroke="#e4e5e8" stroke-width="1"/>
  <rect x="276" y="452" width="6" height="100" rx="3" fill="#0b5cff"/>
  <rect x="312" y="480" width="320" height="14" rx="7" fill="#c2c4c8"/>
  <rect x="312" y="510" width="200" height="14" rx="7" fill="#e4e5e8"/>
</svg>
