<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Depotracker — Demo</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Libre+Baskerville:ital,wght@0,400;0,700;1,400&display=swap" rel="stylesheet">
<style>
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

:root {
  --font-serif: 'Libre Baskerville', Georgia, serif;
  --font-sans: -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif;
  --font-mono: 'SFMono-Regular', Consolas, 'Liberation Mono', Menlo, monospace;
  --green: #16a34a;
  --red: #dc2626;
  --gray-50: #f9fafb;
  --gray-100: #f3f4f6;
  --gray-200: #e5e7eb;
  --gray-300: #d1d5db;
  --gray-400: #9ca3af;
  --gray-500: #6b7280;
  --gray-600: #4b5563;
  --gray-700: #374151;
  --gray-800: #1f2937;
  --gray-900: #111827;
}

html, body {
  height: 100%;
  overflow: hidden;
  font-family: var(--font-sans);
  -webkit-font-smoothing: antialiased;
}

/* ── Background ── */
.bg {
  position: fixed;
  inset: 0;
  background: linear-gradient(135deg, #0a0a0a 0%, #1a1a2e 40%, #16213e 70%, #0f3460 100%);
  z-index: 0;
}

.bg-overlay {
  position: fixed;
  inset: 0;
  background: rgba(0,0,0,0.40);
  z-index: 1;
}

/* Film grain */
.grain {
  position: fixed;
  inset: 0;
  z-index: 2;
  opacity: 0.35;
  mix-blend-mode: overlay;
  pointer-events: none;
}

.grain svg {
  width: 100%;
  height: 100%;
}

/* ── Top bar ── */
.topbar {
  position: fixed;
  top: 0;
  left: 0;
  right: 0;
  z-index: 10;
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 0.75rem 1.25rem;
  color: rgba(255,255,255,0.5);
  font-size: 0.75rem;
}

.topbar-right {
  display: flex;
  align-items: center;
  gap: 1rem;
}

.badge {
  background: rgba(255,255,255,0.1);
  border: 1px solid rgba(255,255,255,0.15);
  border-radius: 9999px;
  padding: 0.25rem 0.75rem;
  font-size: 0.7rem;
  color: rgba(255,255,255,0.6);
  letter-spacing: 0.02em;
}

/* ── Hero ── */
.hero {
  position: relative;
  z-index: 3;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  height: 100vh;
  text-align: center;
  color: #fff;
  padding-bottom: 8rem;
}

.hero-label {
  font-family: var(--font-serif);
  font-style: italic;
  font-size: 1rem;
  color: rgba(255,255,255,0.6);
  margin-bottom: 0.5rem;
}

.hero-number {
  font-family: var(--font-serif);
  font-size: clamp(2.5rem, 8vw, 4.5rem);
  font-weight: 700;
  letter-spacing: -0.02em;
  font-variant-numeric: tabular-nums;
  min-height: 1.2em;
}

/* Currency pills */
.currency-pills {
  display: flex;
  gap: 0.5rem;
  margin-top: 1rem;
}

.pill {
  padding: 0.3rem 1rem;
  border-radius: 9999px;
  border: 1px solid rgba(255,255,255,0.25);
  background: transparent;
  color: rgba(255,255,255,0.5);
  font-family: var(--font-sans);
  font-size: 0.8rem;
  font-weight: 600;
  cursor: pointer;
  transition: all 0.2s;
}

.pill:hover { border-color: rgba(255,255,255,0.5); color: rgba(255,255,255,0.8); }
.pill--active { background: #fff; color: #000; border-color: #fff; }

/* Progress bar */
.progress-wrap {
  margin-top: 1.5rem;
  width: min(20rem, 80vw);
}

.progress-label {
  font-size: 0.7rem;
  color: rgba(255,255,255,0.45);
  margin-bottom: 0.35rem;
  display: flex;
  justify-content: space-between;
}

.progress-track {
  height: 4px;
  background: rgba(255,255,255,0.12);
  border-radius: 9999px;
  overflow: hidden;
}

.progress-fill {
  height: 100%;
  background: #fff;
  border-radius: 9999px;
  transition: width 0.8s cubic-bezier(0.16, 1, 0.3, 1);
}

/* ── Drawer ── */
.drawer-handle {
  position: fixed;
  bottom: 0;
  left: 0;
  right: 0;
  z-index: 20;
  display: flex;
  justify-content: center;
  cursor: pointer;
  -webkit-tap-highlight-color: transparent;
}

.drawer-handle__pill {
  background: rgba(255,255,255,0.15);
  backdrop-filter: blur(12px);
  -webkit-backdrop-filter: blur(12px);
  border: 1px solid rgba(255,255,255,0.12);
  border-radius: 1rem 1rem 0 0;
  padding: 0.6rem 1.5rem 0.5rem;
  display: flex;
  align-items: center;
  gap: 0.5rem;
  color: rgba(255,255,255,0.7);
  font-size: 0.8rem;
  font-weight: 500;
  transition: background 0.2s;
}

.drawer-handle__pill:hover { background: rgba(255,255,255,0.22); }

.drawer-handle__chevron {
  display: inline-block;
  transition: transform 0.3s;
  font-size: 0.65rem;
}

.drawer-handle--open .drawer-handle__chevron {
  transform: rotate(180deg);
}

/* Drawer panel */
.drawer {
  position: fixed;
  bottom: 0;
  left: 0;
  right: 0;
  z-index: 19;
  background: #fff;
  border-radius: 1rem 1rem 0 0;
  max-height: 85vh;
  transform: translateY(100%);
  transition: transform 0.5s cubic-bezier(0.16, 1, 0.3, 1);
  overflow-y: auto;
  box-shadow: 0 -4px 30px rgba(0,0,0,0.25);
}

.drawer--open {
  transform: translateY(0);
}

.drawer-content {
  max-width: 64rem;
  margin: 0 auto;
  padding: 2rem 1.5rem 3rem;
}

/* ── Table ── */
.table-wrap {
  overflow-x: auto;
  -webkit-overflow-scrolling: touch;
}

table {
  width: 100%;
  border-collapse: collapse;
  font-size: 0.85rem;
}

th {
  text-align: left;
  padding: 0.6rem 0.75rem;
  font-size: 0.7rem;
  font-weight: 600;
  text-transform: uppercase;
  letter-spacing: 0.05em;
  color: var(--gray-500);
  border-bottom: 2px solid var(--gray-200);
  white-space: nowrap;
}

th.num, td.num { text-align: right; }

td {
  padding: 0.65rem 0.75rem;
  border-bottom: 1px solid var(--gray-100);
  font-variant-numeric: tabular-nums;
  white-space: nowrap;
}

tr:hover td { background: var(--gray-50); }

.pos-name {
  font-weight: 600;
  color: var(--gray-900);
}

.pos-ticker {
  font-size: 0.7rem;
  color: var(--gray-400);
}

.pnl-pos { color: var(--green); font-weight: 600; }
.pnl-neg { color: var(--red); font-weight: 600; }

.provider-badge {
  display: inline-block;
  font-size: 0.6rem;
  font-weight: 600;
  padding: 0.1rem 0.4rem;
  border-radius: 0.25rem;
  text-transform: uppercase;
  letter-spacing: 0.03em;
  vertical-align: middle;
  margin-left: 0.4rem;
}

.provider-badge--yahoo { background: #dbeafe; color: #1d4ed8; }
.provider-badge--crypto { background: #fef9c3; color: #a16207; }
.provider-badge--manual { background: var(--gray-100); color: var(--gray-500); }

/* ── Responsive ── */
@media (max-width: 640px) {
  .topbar { padding: 0.5rem 0.75rem; }
  .drawer-content { padding: 1.5rem 1rem 2rem; }
  table { font-size: 0.78rem; }
  th, td { padding: 0.5rem; }
  .hide-mobile { display: none; }
}
</style>
</head>
<body>

<!-- Background layers -->
<div class="bg"></div>
<div class="bg-overlay"></div>
<div class="grain">
  <svg><filter id="grain"><feTurbulence type="fractalNoise" baseFrequency="0.65" numOctaves="3" stitchTiles="stitch"/></filter><rect width="100%" height="100%" filter="url(#grain)"/></svg>
</div>

<!-- Top bar -->
<div class="topbar">
  <span id="timestamp"></span>
  <div class="topbar-right">
    <span class="badge">DEMO</span>
  </div>
</div>

<!-- Hero -->
<div class="hero">
  <div class="hero-label">Net Worth</div>
  <div class="hero-number" id="hero-number"></div>
  <div class="currency-pills" id="currency-pills">
    <button class="pill pill--active" data-currency="CHF">CHF</button>
    <button class="pill" data-currency="EUR">EUR</button>
    <button class="pill" data-currency="USD">USD</button>
  </div>
  <div class="progress-wrap">
    <div class="progress-label">
      <span>Zur Million</span>
      <span id="progress-pct"></span>
    </div>
    <div class="progress-track">
      <div class="progress-fill" id="progress-fill"></div>
    </div>
  </div>
</div>

<!-- Drawer handle -->
<div class="drawer-handle" id="drawer-handle">
  <div class="drawer-handle__pill">
    <span id="position-count"></span>
    <span class="drawer-handle__chevron">&#9650;</span>
  </div>
</div>

<!-- Drawer -->
<div class="drawer" id="drawer">
  <div class="drawer-content">
    <div class="table-wrap">
      <table>
        <thead>
          <tr>
            <th>Position</th>
            <th class="num hide-mobile">Anteile</th>
            <th class="num hide-mobile">Kaufkurs</th>
            <th class="num">Aktuell</th>
            <th class="num">Wert</th>
            <th class="num">P&amp;L</th>
          </tr>
        </thead>
        <tbody id="table-body"></tbody>
      </table>
    </div>
  </div>
</div>

<script>
(function () {
  // ── Demo data ──
  var positions = [
    { name: 'Apple Inc.',            ticker: 'AAPL',      provider: 'yahoo',     shares: 15,   avgPrice: 142.50, currency: 'USD', currentPrice: 233.28 },
    { name: 'Microsoft Corp.',       ticker: 'MSFT',      provider: 'yahoo',     shares: 10,   avgPrice: 310.00, currency: 'USD', currentPrice: 415.60 },
    { name: 'SPDR MSCI ACWI IMI',   ticker: 'SPYI.DE',   provider: 'yahoo',     shares: 200,  avgPrice: 168.30, currency: 'EUR', currentPrice: 197.45 },
    { name: 'iShares Core SPI (CH)', ticker: 'CHSPI.SW',  provider: 'yahoo',     shares: 50,   avgPrice: 155.80, currency: 'CHF', currentPrice: 178.20 },
    { name: 'Novo Nordisk',          ticker: 'NOVO-B.CO', provider: 'yahoo',     shares: 25,   avgPrice: 680.00, currency: 'EUR', currentPrice: 762.30 },
    { name: 'Bitcoin',               ticker: 'BTC',       provider: 'coingecko', shares: 0.25, avgPrice: 52000,  currency: 'USD', currentPrice: 96842 },
    { name: 'Ethereum',              ticker: 'ETH',       provider: 'coingecko', shares: 3,    avgPrice: 2800,   currency: 'USD', currentPrice: 2715.40 },
    { name: 'Nestle SA',             ticker: 'NESN.SW',   provider: 'yahoo',     shares: 40,   avgPrice: 98.50,  currency: 'CHF', currentPrice: 83.76 },
    { name: 'Pensionskasse',         ticker: 'manual',    provider: 'manual',    shares: 1,    avgPrice: 85000,  currency: 'CHF', currentPrice: 85000 },
    { name: 'Sparkonto',             ticker: 'manual',    provider: 'manual',    shares: 1,    avgPrice: 25000,  currency: 'CHF', currentPrice: 25000 }
  ];

  var rates = { CHF: 1, EUR: 1.065, USD: 1.135 }; // 1 CHF = x units
  // To convert X currency to CHF: value / rates[currency]
  // To convert CHF to display: valueCHF * rates[displayCurrency]

  var currentCurrency = 'CHF';
  var animFrame = null;
  var animStart = 0;
  var animFrom = 0;
  var animTo = 0;
  var ANIM_DURATION = 800;

  // ── Formatting ──
  function fmt(n, decimals) {
    if (decimals === undefined) decimals = 2;
    var parts = n.toFixed(decimals).split('.');
    var intPart = parts[0].replace(/\B(?=(\d{3})+(?!\d))/g, "'");
    return decimals > 0 ? intPart + '.' + parts[1] : intPart;
  }

  function fmtCurrency(n, cur) {
    return fmt(n) + ' ' + cur;
  }

  // ── Compute totals ──
  function totalInCHF() {
    var sum = 0;
    for (var i = 0; i < positions.length; i++) {
      var p = positions[i];
      var value = p.shares * p.currentPrice;
      sum += value / rates[p.currency];
    }
    return sum;
  }

  function convertFromCHF(chf, toCurrency) {
    return chf * rates[toCurrency];
  }

  // ── Timestamp ──
  var tsEl = document.getElementById('timestamp');
  var now = new Date();
  tsEl.textContent = now.toLocaleDateString('de-CH', { day: '2-digit', month: '2-digit', year: 'numeric' }) +
    ', ' + now.toLocaleTimeString('de-CH', { hour: '2-digit', minute: '2-digit' });

  // ── Position count ──
  document.getElementById('position-count').textContent = positions.length + ' Positionen';

  // ── Animated hero number ──
  var heroEl = document.getElementById('hero-number');

  function easeOutCubic(t) { return 1 - Math.pow(1 - t, 3); }

  function animateNumber(to) {
    animFrom = animTo || 0;
    animTo = to;
    animStart = performance.now();
    if (!animFrame) tick();
  }

  function tick() {
    var elapsed = performance.now() - animStart;
    var t = Math.min(elapsed / ANIM_DURATION, 1);
    var eased = easeOutCubic(t);
    var current = animFrom + (animTo - animFrom) * eased;
    heroEl.textContent = fmt(current, 0) + ' ' + currentCurrency;
    if (t < 1) {
      animFrame = requestAnimationFrame(tick);
    } else {
      animFrame = null;
    }
  }

  // ── Progress bar ──
  function updateProgress(totalDisplay) {
    var goal = 1000000;
    // Goal is always in the display currency
    var pct = Math.min((totalDisplay / goal) * 100, 100);
    document.getElementById('progress-pct').textContent = fmt(pct, 1) + '%';
    document.getElementById('progress-fill').style.width = pct + '%';
  }

  // ── Currency pills ──
  var pills = document.querySelectorAll('.pill');
  for (var i = 0; i < pills.length; i++) {
    pills[i].addEventListener('click', function () {
      for (var j = 0; j < pills.length; j++) pills[j].classList.remove('pill--active');
      this.classList.add('pill--active');
      currentCurrency = this.getAttribute('data-currency');
      update();
    });
  }

  // ── Table ──
  function renderTable() {
    var tbody = document.getElementById('table-body');
    var rows = '';
    for (var i = 0; i < positions.length; i++) {
      var p = positions[i];
      var isManual = p.provider === 'manual';
      var value = p.shares * p.currentPrice;
      var valueCHF = value / rates[p.currency];
      var valueDisplay = convertFromCHF(valueCHF, currentCurrency);

      var cost = p.shares * p.avgPrice;
      var pnlAbs = value - cost;
      var pnlPct = cost > 0 ? (pnlAbs / cost) * 100 : 0;

      // Convert pnl to display currency
      var pnlDisplay = pnlAbs / rates[p.currency] * rates[currentCurrency];

      var pnlClass = pnlAbs >= 0 ? 'pnl-pos' : 'pnl-neg';
      var pnlSign = pnlAbs >= 0 ? '+' : '';

      var badgeClass = p.provider === 'coingecko' ? 'provider-badge--crypto' :
                       p.provider === 'manual' ? 'provider-badge--manual' : 'provider-badge--yahoo';
      var badgeLabel = p.provider === 'coingecko' ? 'Crypto' :
                       p.provider === 'manual' ? 'Manual' : 'Stock';

      // Current price in display currency
      var currentDisplay = p.currentPrice / rates[p.currency] * rates[currentCurrency];

      rows += '<tr>' +
        '<td><div class="pos-name">' + p.name + '<span class="provider-badge ' + badgeClass + '">' + badgeLabel + '</span></div>' +
        '<div class="pos-ticker">' + p.ticker + '</div></td>' +
        '<td class="num hide-mobile">' + (isManual ? '—' : fmt(p.shares, p.shares < 1 ? 4 : 0)) + '</td>' +
        '<td class="num hide-mobile">' + (isManual ? '—' : fmt(p.avgPrice) + ' ' + p.currency) + '</td>' +
        '<td class="num">' + (isManual ? '—' : fmt(currentDisplay)) + '</td>' +
        '<td class="num" style="font-weight:600">' + fmtCurrency(valueDisplay, currentCurrency) + '</td>' +
        '<td class="num ' + (isManual ? '' : pnlClass) + '">' +
          (isManual ? '—' : pnlSign + fmt(pnlDisplay) + ' (' + pnlSign + fmt(pnlPct, 1) + '%)') +
        '</td>' +
        '</tr>';
    }
    tbody.innerHTML = rows;
  }

  // ── Update all ──
  function update() {
    var chf = totalInCHF();
    var display = convertFromCHF(chf, currentCurrency);
    animateNumber(display);
    updateProgress(display);
    renderTable();
  }

  // ── Drawer toggle ──
  var drawerHandle = document.getElementById('drawer-handle');
  var drawer = document.getElementById('drawer');
  var drawerOpen = false;

  drawerHandle.addEventListener('click', function () {
    drawerOpen = !drawerOpen;
    drawer.classList.toggle('drawer--open', drawerOpen);
    drawerHandle.classList.toggle('drawer-handle--open', drawerOpen);
  });

  // ── Init ──
  update();
})();
</script>
</body>
</html>
