<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>404, Gian-Luca Savino</title>
  <link rel="icon" href="/favicon.png" sizes="64x64" type="image/png">
  <link rel="icon" href="/favicon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="/css/style.css">
</head>
<body>

  <!-- Die eigene Seite eines Posts (feed/p/<id>/) entsteht erst kurz nach dem Posten.
       Bis dahin, und fuer geloeschte Posts, fuehrt der Link in den Feed zu diesem Post. -->
  <script>
    (function () {
      var match = /^\/feed\/p\/([\w-]+)\/?$/.exec(window.location.pathname);
      if (match) { window.location.replace('/feed/#' + match[1]); }
    })();
  </script>

  <main class="card">
    <h1 class="card__name">404</h1>
    <ul class="card__links">
      <li><a href="/">Gian-Luca Savino</a></li>
    </ul>
  </main>

</body>
</html>
