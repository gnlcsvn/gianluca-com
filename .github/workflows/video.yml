# Laeuft nach jeder Aenderung an feed/posts.json und tut zwei Dinge:
# 1. rechnet neue Videos klein (.github/video.py),
# 2. baut fuer jeden Post eine eigene Seite mit Vorschaubild fuer Messenger (.github/share.py).
#
# Zu 1:
# Der Editor (/post/) legt ein Video nicht in den Feed, sondern in einen eigenen Zweig
# "upload/<post>-<n>", und traegt es in feed/posts.json mit "processing": true ein.
# Diese Action laeuft, sobald sich posts.json aendert: sie holt das Original aus dem
# Zweig, rechnet es mit ffmpeg um, legt die kleine Fassung nach feed/media/ und loescht
# den Zweig. So landet das grosse Original nie im Verlauf von main.
name: video

on:
  push:
    branches: [main]
    paths: ['feed/posts.json']
  workflow_dispatch:

# Immer nur ein Lauf zur Zeit, weitere warten.
concurrency:
  group: video
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  video:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - name: Gibt es etwas zu tun?
        id: todo
        run: |
          # ein Video wartet auf das Umrechnen, oder ein Zweig mit einem Original liegt noch herum
          if grep -q '"processing": *true' feed/posts.json; then echo "found=yes" >> "$GITHUB_OUTPUT"; fi
          if [ -n "$(git ls-remote --heads origin 'refs/heads/upload/*')" ]; then echo "found=yes" >> "$GITHUB_OUTPUT"; fi

      - name: ffmpeg einrichten
        if: steps.todo.outputs.found == 'yes'
        run: |
          if ! command -v ffmpeg >/dev/null; then sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg; fi
          ffmpeg -version | head -1

      - name: Wer hier committet
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Videos umrechnen und eintragen
        if: steps.todo.outputs.found == 'yes'
        run: python3 .github/video.py

      - name: Seiten und Vorschaubilder der Posts
        id: share
        run: |
          python3 -m pip install --quiet --disable-pip-version-check pillow
          python3 .github/share.py

      # Die Website baut GitHub nach dem Push dieser Action von selbst neu. Ein zweiter
      # Anstoss von hier hat Builds doppelt gestartet und einmal die Warteschlange blockiert.
